name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  program:
    name: build-sbf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Agave toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: solana --version
      - name: Build the on-chain program
        # Isolated target dir: see the note in the Makefile. Sharing one with the
        # host build makes cargo feed a host .dylib to the SBF rustc.
        run: make build-sbf
      - name: Run the on-chain test suite against the built .so
        run: cargo test -p mirror-pool-program --all-features
