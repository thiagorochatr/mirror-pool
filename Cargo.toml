[workspace]
resolver = "2"
members = [
    "crates/mirror-core",
    "crates/mirror-circuit",
    "crates/mirror-provenance",
    "crates/mirror-cli",
    "programs/mirror-pool",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/solanabr/mirror-pool"

# The arkworks major must stay 0.5 across every crate: light-poseidon 0.4 is built
# against 0.5, and Fr from 0.5 and 0.6 are distinct types that will not unify.
[workspace.dependencies]
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ff = { version = "0.5", default-features = false }
ark-ec = { version = "0.5", default-features = false }
ark-relations = { version = "0.5", default-features = false }
ark-r1cs-std = { version = "0.5", default-features = false }
ark-groth16 = { version = "0.5", default-features = false }
ark-snark = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }
ark-std = { version = "0.5", default-features = false }
light-poseidon = "0.4"
groth16-solana = "0.2"
solana-program = "4.0"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

mirror-core = { path = "crates/mirror-core" }
mirror-circuit = { path = "crates/mirror-circuit" }
mirror-provenance = { path = "crates/mirror-provenance" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
